<style>
/* =========================================================================
   VIZIO SIGNAGE — export autocontido · instância ELITE Consultoria e Consórcios
   Um engine, skins por dados. Este arquivo é um EXPORT single-file do engine
   compartilhado (VIZIO/Sites/_clientes/_signage/engine) para rodar direto na
   TV via file:// (sem servidor). CSS/JS/AURA/assets embutidos.
   Alvo: TV 16:9 (1920x1080), leitura a 3-5 m. Margens TV-safe ~5%.
   ========================================================================= */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#0A0A0B; --bg2:#141416; --ink:#FBF7EF; --muted:#A7A39B;
  --accent:#C9A85C; --accent2:#E6D08A;
  --grad:linear-gradient(90deg,#A8863B 0%,#C9A85C 45%,#E6D08A 100%);
  --font-display:'Chakra Petch','Michroma',sans-serif;
  --font-body:'Inter',system-ui,sans-serif;
  --pattern:none;
  --safe:5vh; --u:1.2vh;
}

html,body{height:100%;background:var(--bg);color:var(--ink);
  font-family:var(--font-body);overflow:hidden;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}

/* palco 16:9 — TRANSPARENTE para a luz AURA respirar por trás das cenas escuras */
#signage{position:fixed;inset:0;background:transparent;overflow:hidden;cursor:none;z-index:1}

/* ---------- CENA ---------- */
.sg-scene{
  position:absolute;inset:0;display:grid;align-content:center;
  padding:var(--safe) calc(var(--safe) + 2vw);
  opacity:0;visibility:hidden;transform:scale(1.015);
  transition:opacity .9s ease, transform 1.2s ease, visibility 0s linear .9s;
  /* véu escuro translúcido: legibilidade + a luz AURA aparece no topo */
  background:linear-gradient(180deg,rgba(10,10,11,.32) 0%,rgba(10,10,11,.62) 55%,rgba(10,10,11,.82) 100%);
}
.sg-scene.is-active{opacity:1;visibility:visible;transform:scale(1);
  transition:opacity 1s ease, transform 6s ease}

/* fundo cheio (foto/gradiente) para cenas cover/gallery/contact com imagem */
.sg-bg{position:absolute;inset:0;overflow:hidden;z-index:0}
.sg-bg img{width:100%;height:100%;object-fit:cover;object-position:center;transform:scale(1.06)}
.is-active .sg-bg.kenburns img{animation:sg-kb 12s ease-out forwards}
@keyframes sg-kb{from{transform:scale(1.02)}to{transform:scale(1.14)}}
.sg-scrim{position:absolute;inset:0;z-index:1;
  background:linear-gradient(180deg,rgba(0,0,0,.15) 0%,rgba(0,0,0,.35) 45%,rgba(0,0,0,.78) 100%)}
.sg-scrim.side{background:linear-gradient(90deg,rgba(0,0,0,.82) 0%,rgba(0,0,0,.55) 45%,rgba(0,0,0,.12) 100%)}

.sg-inner{position:relative;z-index:2;max-width:82vw}

/* ---------- TIPOGRAFIA ---------- */
.sg-kicker{font-family:var(--font-body);font-weight:600;letter-spacing:.32em;
  text-transform:uppercase;font-size:clamp(14px,1.7vh,26px);color:var(--accent);
  display:flex;align-items:center;gap:.8em;margin-bottom:calc(var(--u)*1.6)}
.sg-kicker::before{content:"";width:2.4em;height:2px;background:var(--accent);flex:none}

.sg-title{font-family:var(--font-display);font-weight:700;line-height:1.02;
  font-size:clamp(40px,8.4vh,120px);letter-spacing:-.01em;color:var(--ink);text-wrap:balance}
.sg-title em{font-style:normal;background:var(--grad);-webkit-background-clip:text;
  background-clip:text;color:transparent}
.sg-title .grad{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}

.sg-lead{font-size:clamp(20px,3.1vh,44px);line-height:1.4;color:var(--muted);
  max-width:26ch;margin-top:calc(var(--u)*2)}
.sg-scene.center{justify-items:center;text-align:center}
.sg-scene.center .sg-kicker{justify-content:center}
.sg-scene.center .sg-lead{max-width:40ch}

/* ---------- COVER ---------- */
.sg-cover{justify-items:center;text-align:center}
.sg-logo{display:block;height:auto;filter:drop-shadow(0 8px 40px rgba(201,168,92,.28))}
.is-active .sg-logo{animation:sg-rise 1.2s ease both}
@keyframes sg-rise{from{opacity:0;transform:translateY(24px) scale(.96)}to{opacity:1;transform:none}}
.sg-cover .sg-title{margin-top:calc(var(--u)*2)}
.sg-cover .sg-sub{font-family:'Michroma',var(--font-display);font-size:clamp(16px,2.1vh,30px);
  color:var(--accent2);letter-spacing:.24em;margin-top:calc(var(--u)*1.6)}

/* ---------- PILARES / VANTAGENS ---------- */
.sg-grid{display:grid;gap:calc(var(--u)*2.2);margin-top:calc(var(--u)*3);width:100%}
.sg-grid.cols-2{grid-template-columns:repeat(2,1fr)}
.sg-grid.cols-3{grid-template-columns:repeat(3,1fr)}
.sg-grid.cols-4{grid-template-columns:repeat(4,1fr)}
.sg-card{background:rgba(201,168,92,.05);border:1px solid rgba(201,168,92,.22);
  border-radius:18px;padding:calc(var(--u)*2.4) calc(var(--u)*2);
  display:flex;flex-direction:column;gap:calc(var(--u)*1);backdrop-filter:blur(2px)}
.is-active .sg-card{animation:sg-rise .9s ease both}
.is-active .sg-card:nth-child(2){animation-delay:.10s}
.is-active .sg-card:nth-child(3){animation-delay:.20s}
.is-active .sg-card:nth-child(4){animation-delay:.30s}
.sg-card .ic-badge{width:clamp(48px,7vh,84px);height:clamp(48px,7vh,84px);border-radius:14px;
  display:grid;place-items:center;background:var(--grad);color:#0A0A0B;
  font-family:var(--font-display);font-weight:700;font-size:clamp(22px,3.4vh,40px)}
.sg-card h3{font-family:var(--font-display);font-weight:700;font-size:clamp(20px,3vh,40px);
  line-height:1.06;color:var(--ink)}
.sg-card p{font-size:clamp(15px,1.9vh,26px);line-height:1.4;color:var(--muted)}

/* ---------- STATEMENT ---------- */
.sg-split{display:grid;grid-template-columns:1.15fr .85fr;gap:5vw;align-items:center;width:100%}

/* ---------- TABELA DE CRÉDITO (novo tipo de cena, genérico) ---------- */
.sg-tablewrap{width:100%;max-width:none;justify-items:center;text-align:center}
.sg-tablewrap .sg-kicker{justify-content:center}
.sg-tablewrap .sg-title{font-size:clamp(30px,5.6vh,72px)}
.sg-tablewrap .sg-lead{color:var(--accent2);max-width:60ch;margin-top:calc(var(--u)*1)}
.sg-table{margin-top:calc(var(--u)*2.4);width:min(84vw,1280px);
  border:1px solid rgba(201,168,92,.35);border-radius:18px;overflow:hidden;
  background:linear-gradient(180deg,rgba(201,168,92,.06),rgba(10,10,11,.20))}
.sg-trow{display:grid;grid-template-columns:1fr 1fr}
.sg-trow>div{padding:calc(var(--u)*.98) calc(var(--u)*2.2);display:flex;align-items:center;
  justify-content:center;border-bottom:1px solid rgba(201,168,92,.16)}
.sg-trow>div:first-child{border-right:1px solid rgba(201,168,92,.16)}
.sg-trow:last-child>div{border-bottom:0}
.sg-thead>div{font-family:var(--font-body);font-weight:700;text-transform:uppercase;
  letter-spacing:.16em;font-size:clamp(14px,1.9vh,26px);color:var(--accent);
  background:rgba(201,168,92,.12);line-height:1.15}
.sg-tc{font-family:var(--font-display);font-weight:700;color:var(--ink);
  font-size:clamp(26px,4.6vh,60px);letter-spacing:.01em;gap:.28em}
.sg-tc .cur{font-size:.42em;font-weight:600;color:var(--accent2);align-self:flex-start;
  margin-top:.35em}
.sg-trow:nth-child(even) .sg-tc{color:#fff}
.sg-tfoot{margin-top:calc(var(--u)*1.2);font-size:clamp(14px,1.8vh,24px);color:var(--muted);
  max-width:70ch;text-align:center}
.sg-tfoot b{color:var(--accent2);font-weight:600}

/* ---------- CONTACT (+ QR) ---------- */
.sg-contact{justify-items:center;text-align:center}
.sg-lines{display:grid;gap:calc(var(--u)*1.5);margin-top:calc(var(--u)*2.6)}
.sg-lines .row{display:flex;align-items:center;justify-content:center;gap:.7em;
  font-size:clamp(20px,3vh,42px);color:var(--ink)}
.sg-lines .row svg{width:clamp(24px,3.4vh,44px);height:auto;color:var(--accent);flex:none}
.sg-lines .row small{color:var(--muted);font-size:.56em;letter-spacing:.14em;
  text-transform:uppercase;display:block}
.sg-contactgrid{display:grid;grid-template-columns:1.25fr .75fr;gap:6vw;align-items:center;
  width:100%;max-width:none}
.sg-contactgrid .info{justify-items:start;text-align:left}
.sg-contactgrid .info .sg-kicker{justify-content:flex-start}
.sg-contactgrid .info .sg-lines{margin-top:calc(var(--u)*2)}
.sg-contactgrid .info .sg-lines .row{justify-content:flex-start}
.sg-qr{display:grid;justify-items:center;gap:calc(var(--u)*1.4)}
.sg-qrbox{background:#FBF7EF;border-radius:22px;padding:clamp(14px,2vh,26px);
  box-shadow:0 24px 70px rgba(0,0,0,.5),0 0 0 1px rgba(201,168,92,.4)}
.sg-qrbox svg{display:block;width:clamp(180px,26vh,320px);height:auto}
.sg-qrlabel{font-family:var(--font-display);font-weight:600;color:var(--accent2);
  font-size:clamp(16px,2.2vh,30px);text-align:center;line-height:1.2;max-width:16ch}

/* ---------- HUD ---------- */
.sg-top{position:fixed;top:0;left:0;height:5px;z-index:50;background:var(--grad);width:0;
  box-shadow:0 0 18px var(--accent)}
.sg-top.run{transition:width linear}
.sg-dots{position:fixed;left:0;right:0;bottom:calc(var(--safe)*.5);z-index:50;
  display:flex;gap:12px;justify-content:center;pointer-events:none}
.sg-dots i{width:10px;height:10px;border-radius:99px;background:rgba(255,255,255,.24);transition:all .5s ease}
.sg-dots i.on{width:34px;background:var(--accent)}
.sg-wm{position:fixed;right:calc(var(--safe)*.7);bottom:calc(var(--safe)*.5);z-index:50;
  font-size:clamp(11px,1.3vh,16px);letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.26)}

.sg-msg{position:fixed;inset:0;display:grid;place-items:center;text-align:center;
  color:var(--muted);font-size:clamp(16px,2.2vh,28px);padding:8vw;z-index:100}

/* ---------- AURA "Luz da Marca" (variante ouro, sem .vz-ray) ---------- */
.vz-afix{position:fixed;inset:-12%;z-index:0;pointer-events:none;will-change:transform;transition:transform .12s linear}
.vz-glow{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;background:
  radial-gradient(46vw 46vw at 50% 30%,rgba(201,168,92,.26),transparent 62%),
  radial-gradient(60vw 44vw at 12% -6%,rgba(201,168,92,.14),transparent 66%),
  radial-gradient(52vw 40vw at 106% 4%,rgba(230,208,138,.10),transparent 64%);
  animation:vzBreathe 7s ease-in-out infinite}
@keyframes vzBreathe{0%,100%{opacity:.58;transform:scale(1)}50%{opacity:1;transform:scale(1.06)}}
.vz-floor{position:absolute;left:50%;bottom:-14%;width:120vw;height:52vh;transform:translateX(-50%);
  pointer-events:none;mix-blend-mode:screen;
  background:radial-gradient(50% 50% at 50% 50%,rgba(201,168,92,.22),rgba(201,168,92,.06) 45%,transparent 72%);
  filter:blur(12px);animation:vzFloor 9s ease-in-out infinite}
@keyframes vzFloor{0%,100%{opacity:.5;transform:translateX(-50%) scaleY(1)}50%{opacity:.9;transform:translateX(-50%) scaleY(1.12)}}
.vz-parts{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;opacity:.8}

@media (prefers-reduced-motion:reduce){
  .sg-bg img,.is-active .sg-bg.kenburns img{animation:none!important;transform:none!important}
  .is-active .sg-logo,.is-active .sg-card{animation:none!important}
  .sg-scene{transition:opacity .6s ease}
  .vz-glow,.vz-floor{animation:none!important}.vz-afix{transition:none}
}

  <script>
  /* ---------- AURA "Luz da Marca" — variante ouro (glow + floor + poeira) ----------
     Derivada do aura.js oficial v3 (perfil limpo, sem os feixes .vz-ray).
     Cores fixadas em ouro para esta skin; não reintroduz a linha dourada. */
  (function(){
    'use strict';
    var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    var GOLD='201,168,92', GLOW='230,208,138';
    var mx=0,my=0,cmx=0,cmy=0;
    addEventListener('pointermove',function(e){mx=(e.clientX/innerWidth-.5)*2;my=(e.clientY/innerHeight-.5)*2;},{passive:true});
    function particles(canvas){
      var ctx=canvas.getContext('2d'),parts=[],raf=0;
      function size(){canvas.width=Math.max(1,innerWidth*1.24);canvas.height=Math.max(1,innerHeight*1.24);}
      function seed(){var n=Math.round((canvas.width*canvas.height)/22000);n=Math.max(30,Math.min(90,n));parts=[];
        for(var i=0;i<n;i++){parts.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,
          r:Math.random()*1.9+.5,vx:(Math.random()-.5)*.20,vy:-(Math.random()*.28+.05),
          a:Math.random()*.5+.20,z:Math.random()*16+5,ph:Math.random()*6.283});}}
      function loop(t){cmx+=(mx-cmx)*.06;cmy+=(my-cmy)*.06;ctx.clearRect(0,0,canvas.width,canvas.height);
        for(var i=0;i<parts.length;i++){var p=parts[i];p.x+=p.vx;p.y+=p.vy;
          if(p.y<-20){p.y=canvas.height+20;p.x=Math.random()*canvas.width;}
          if(p.x<-20)p.x=canvas.width+20;if(p.x>canvas.width+20)p.x=-20;
          var tw=.65+.35*Math.sin(t/900+p.ph),dx=p.x+cmx*p.z,dy=p.y+cmy*p.z;
          ctx.beginPath();ctx.arc(dx,dy,p.r,0,6.283);ctx.fillStyle='rgba('+GLOW+','+(p.a*tw)+')';ctx.fill();
          if(p.r>1.2){ctx.beginPath();ctx.arc(dx,dy,p.r*3.2,0,6.283);ctx.fillStyle='rgba('+GOLD+','+(p.a*tw*.13)+')';ctx.fill();}}
        raf=requestAnimationFrame(loop);}
      size();seed();addEventListener('resize',function(){size();seed();});
      if(!reduce)raf=requestAnimationFrame(loop);
    }
    var afix;
    function tickFix(){if(!afix||reduce)return;afix.style.transform='translate('+(cmx*30)+'px,'+(cmy*24)+'px)';requestAnimationFrame(tickFix);}
    function el(c){var d=document.createElement('div');d.className=c;return d;}
    function mount(){
      afix=el('vz-afix');afix.appendChild(el('vz-glow'));afix.appendChild(el('vz-floor'));
      var cv=document.createElement('canvas');cv.className='vz-parts';afix.appendChild(cv);
      document.body.insertBefore(afix,document.body.firstChild);particles(cv);tickFix();
    }
    if(document.readyState!=='loading')mount();else document.addEventListener('DOMContentLoaded',mount);
  })();
  </script>

  <script>
  /* ======================================================================
     SIGNAGE ENGINE (export inline) — fiel ao engine compartilhado, com dois
     renderers adicionais genéricos: `table` (tabela de crédito) e reuso de
     `pillars`/`contact`. Lê os dados de window.SIGNAGE_DATA (sem fetch, roda
     em file://). Tema já baixado no CSS :root acima.
     ====================================================================== */
  (function(){
    'use strict';
    var ICONS={
      pin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0116 0z"/><circle cx="12" cy="10" r="3"/></svg>',
      phone:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.9v3a2 2 0 01-2.2 2 19.8 19.8 0 01-8.6-3 19.5 19.5 0 01-6-6 19.8 19.8 0 01-3-8.6A2 2 0 014.1 2h3a2 2 0 012 1.7c.1.9.3 1.8.6 2.6a2 2 0 01-.5 2.1L8.1 9.6a16 16 0 006 6l1.2-1.1a2 2 0 012.1-.5c.8.3 1.7.5 2.6.6a2 2 0 011.7 2z"/></svg>',
      chat:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.4 8.4 0 01-9 8.4 9.9 9.9 0 01-4-.9L3 21l1.9-4a8.4 8.4 0 01-.9-4 8.4 8.4 0 019-8.4 8.4 8.4 0 018 6.4z"/></svg>',
      globe:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 010 18 15 15 0 010-18z"/></svg>',
      instagram:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>'
    };
    function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
    function rich(s){s=esc(s);return s.replace(/&lt;(\/?)(em|b|br)\s*\/?&gt;/g,'<$1$2>');}
    function asset(p){return p||'';}

    function bg(src,kb,side){if(!src)return '';
      return '<div class="sg-bg'+(kb?' kenburns':'')+'"><img src="'+esc(src)+'" alt=""></div><div class="sg-scrim'+(side?' side':'')+'"></div>';}

    var R={
      cover:function(s){
        var w=s.logoWidth||300;
        return bg(asset(s.image),true)+
          '<div class="sg-inner sg-cover">'+
          (s.logo?'<img class="sg-logo" src="'+esc(asset(s.logo))+'" alt="Elite Consultoria e Consórcios" style="width:min('+w+'px,52vw)">':'')+
          (s.kicker?'<div class="sg-kicker" style="justify-content:center;margin-top:2.4vh">'+rich(s.kicker)+'</div>':'')+
          (s.title?'<h1 class="sg-title">'+rich(s.title)+'</h1>':'')+
          (s.subtitle?'<div class="sg-sub">'+rich(s.subtitle)+'</div>':'')+
          '</div>';
      },
      statement:function(s){
        return '<div class="sg-inner">'+
          (s.kicker?'<div class="sg-kicker">'+rich(s.kicker)+'</div>':'')+
          (s.title?'<h2 class="sg-title">'+rich(s.title)+'</h2>':'')+
          (s.lead?'<p class="sg-lead">'+rich(s.lead)+'</p>':'')+'</div>';
      },
      pillars:function(s){
        var cols=s.columns||(s.items?s.items.length:3);
        var cards=(s.items||[]).map(function(it){
          return '<div class="sg-card"><div class="ic-badge">'+esc(it.badge||'*')+'</div>'+
            (it.title?'<h3>'+rich(it.title)+'</h3>':'')+
            (it.text?'<p>'+rich(it.text)+'</p>':'')+'</div>';
        }).join('');
        return '<div class="sg-inner" style="max-width:none">'+
          (s.kicker?'<div class="sg-kicker">'+rich(s.kicker)+'</div>':'')+
          (s.title?'<h2 class="sg-title" style="font-size:clamp(32px,6vh,80px)">'+rich(s.title)+'</h2>':'')+
          '<div class="sg-grid cols-'+cols+'">'+cards+'</div></div>';
      },
      table:function(s){
        var head='<div class="sg-trow sg-thead"><div>'+rich(s.colA||'Crédito')+'</div><div>'+rich(s.colB||'Parcela a partir de')+'</div></div>';
        var rows=(s.rows||[]).map(function(r){
          return '<div class="sg-trow"><div class="sg-tc"><span class="cur">R$</span>'+rich(r[0])+'</div>'+
            '<div class="sg-tc"><span class="cur">R$</span>'+rich(r[1])+'</div></div>';
        }).join('');
        return '<div class="sg-inner sg-tablewrap">'+
          (s.kicker?'<div class="sg-kicker">'+rich(s.kicker)+'</div>':'')+
          (s.title?'<h2 class="sg-title sg-ttitle">'+rich(s.title)+'</h2>':'')+
          (s.lead?'<p class="sg-lead sg-tlead">'+rich(s.lead)+'</p>':'')+
          '<div class="sg-table">'+head+rows+'</div>'+
          (s.foot?'<p class="sg-tfoot">'+rich(s.foot)+'</p>':'')+'</div>';
      },
      contact:function(s){
        var rows=(s.lines||[]).map(function(ln){
          var ic=ICONS[ln.icon]||'';
          return '<div class="row">'+ic+'<div>'+(ln.label?'<small>'+rich(ln.label)+'</small>':'')+rich(ln.value)+'</div></div>';
        }).join('');
        var qrsvg=s.qr?(document.getElementById('qrsvg')||{}).textContent||'':'';
        var info='<div class="info">'+
          (s.kicker?'<div class="sg-kicker">'+rich(s.kicker)+'</div>':'')+
          (s.title?'<h2 class="sg-title" style="font-size:clamp(30px,5.4vh,74px)">'+rich(s.title)+'</h2>':'')+
          (s.lead?'<p class="sg-lead">'+rich(s.lead)+'</p>':'')+
          '<div class="sg-lines">'+rows+'</div></div>';
        if(s.qr){
          return '<div class="sg-inner sg-contactgrid" style="max-width:none">'+info+
            '<div class="sg-qr"><div class="sg-qrbox">'+qrsvg+'</div>'+
            (s.qrLabel?'<div class="sg-qrlabel">'+rich(s.qrLabel)+'</div>':'')+'</div></div>';
        }
        return '<div class="sg-inner sg-contact" style="max-width:none;justify-items:center;text-align:center">'+info+'</div>';
      }
    };

    function classesFor(s){var c=['sg-scene','sg-'+s.type];
      if(s.align==='center'||s.type==='cover')c.push('center');return c.join(' ');}
    function imagesOf(s){var out=[];if(s.image)out.push(asset(s.image));if(s.logo)out.push(asset(s.logo));return out;}
    function preload(list){list.forEach(function(src){var i=new Image();i.src=src;});}

    function boot(data){
      var root=document.getElementById('signage');
      var scenes=(data.scenes||[]).filter(function(s){return s&&s.enabled!==false&&R[s.type];});
      if(!scenes.length){root.innerHTML='<div class="sg-msg">Nenhuma cena ativa.</div>';return;}
      root.innerHTML='';
      var top=document.createElement('div');top.className='sg-top';
      var dots=document.createElement('div');dots.className='sg-dots';
      var els=scenes.map(function(s){
        var el=document.createElement('section');el.className=classesFor(s);el.innerHTML=R[s.type](s);
        root.appendChild(el);var d=document.createElement('i');dots.appendChild(d);return el;
      });
      root.appendChild(top);root.appendChild(dots);
      if(data.watermark!==false){var wm=document.createElement('div');wm.className='sg-wm';
        wm.textContent=data.watermark||'Tecnologia VIZIO';root.appendChild(wm);}
      var def=(data.defaults&&data.defaults.duration)||11000;
      var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
      var idKey='signage:'+(data.id||'elite')+':idx';
      var i=0,timer=null;
      try{var saved=parseInt(localStorage.getItem(idKey),10);if(saved>=0&&saved<scenes.length)i=saved;}catch(e){}
      function show(n){
        i=n;try{localStorage.setItem(idKey,String(i));}catch(e){}
        var dur=scenes[i].duration||def;
        els.forEach(function(el,k){el.classList.toggle('is-active',k===i);});
        dots.querySelectorAll('i').forEach(function(d,k){d.classList.toggle('on',k===i);});
        top.classList.remove('run');top.style.width='0';void top.offsetWidth;
        if(!reduce){top.classList.add('run');top.style.transitionDuration=dur+'ms';top.style.width='100%';}
        else{top.style.width='100%';}
        preload(imagesOf(scenes[(i+1)%scenes.length]));
        clearTimeout(timer);timer=setTimeout(function(){show((i+1)%scenes.length);},dur);
      }
      preload(imagesOf(scenes[i]).concat(imagesOf(scenes[(i+1)%scenes.length])));
